server:
  # 8090 避开本机已被其它项目占用的 8080 / 8081
  # 如需修改：命令行传 --server.port=xxxx，或设置环境变量 SERVER_PORT
  port: 8090
  shutdown: graceful

spring:
  application:
    name: campus-club-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 以下为 docker-compose 起的本地开发库默认值。
    # 生产环境不要改这里，改用 Spring Boot 原生覆盖：
    #   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
    url: jdbc:mysql://127.0.0.1:3316/campus_club?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: campus
    password: campus123456
    hikari:
      pool-name: CampusHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      # docker-compose 把容器 6379 映射到宿主机 6380（避开本机其它项目占用的 6379）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      # 超时必须显式给：Redis 卡住时不能让业务线程一起卡住，宁可快速失败降级查库
      timeout: 1s
      connect-timeout: 1s
      client-type: lettuce

# 活动读缓存。全部可在运行时用环境变量覆盖，方便压测时调参。
app:
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    # 详情变动少、查询贵，给长 TTL；列表变动频繁，只能给短 TTL
    detail-ttl: 10m
    list-ttl: 60s
    # 空值标记的 TTL 要远小于正常值：它挡的是穿透，不是常规数据
    null-marker-ttl: 60s
    # 过期时间抖动幅度（±秒）：避免大批 key 同一秒失效，把流量一次性砸到数据库
    jitter-seconds: 30
    # 回填互斥锁的持有上限，必须远大于一次查询耗时，又不能让死锁的持有者长期挡住其他线程
    lock-ttl: 3s
    # Redis 故障后的静默期：期间直接走数据库，不再每次请求都去撞一个挂掉的连接
    degraded-cooldown: 10s
  log:
    # 超过这个耗时的请求单独打一条 WARN，方便按级别筛出来
    slow-request-millis: 500
    # 超过这个耗时的 SQL 单独打一条 WARN，把「接口慢」和「SQL 慢」区分开
    slow-sql-millis: 200

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 关闭一级缓存以外的隐式行为，避免同名 SQL 复用造成误判
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

management:
  endpoints:
    web:
      exposure:
        # metrics 用于看缓存命中率等指标；只暴露这三个，不做通配
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  # 日志格式：把 traceId 放在固定位置，一次请求的所有日志都能用同一个 ID grep 出来。
  # %clr(...) 是 Spring Boot 注册的颜色转换器，{faint}/{cyan} 控制样式。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) %clr([%X{traceId:-no-trace}]){faint} %clr([%thread]){faint} %clr(%logger{36}){cyan} - %msg%n"
  level:
    root: INFO
    com.campus.club: INFO

---
# 本地开发：打印 SQL，方便核对手写语句与索引命中情况
spring:
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.campus.club: DEBUG

---
# 生产：不打印 SQL，避免日志膨胀与参数泄漏
spring:
  config:
    activate:
      on-profile: prod

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.campus.club: INFO
